<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2000" width="1600" height="2000" fill="none" role="img" aria-label="Portrait placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#242427"/>
      <stop offset="0.55" stop-color="#131315"/>
      <stop offset="1" stop-color="#0B0B0C"/>
    </linearGradient>

    <radialGradient id="glow" cx="52%" cy="30%" r="58%">
      <stop offset="0" stop-color="#B79B6B" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#B79B6B" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#B79B6B" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="figure" x1="0.2" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#3B3B40"/>
      <stop offset="0.5" stop-color="#2A2A2E"/>
      <stop offset="1" stop-color="#1B1B1E"/>
    </linearGradient>

    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B79B6B" stop-opacity="0"/>
      <stop offset="1" stop-color="#B79B6B" stop-opacity="0.55"/>
    </linearGradient>

    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0B0C" stop-opacity="0"/>
      <stop offset="0.75" stop-color="#0B0B0C" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0B0B0C" stop-opacity="0.95"/>
    </linearGradient>

    <clipPath id="frame"><rect x="0" y="0" width="1600" height="2000"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1600" height="2000" fill="url(#bg)"/>
    <rect width="1600" height="2000" fill="url(#glow)"/>

    <!-- abstract bust silhouette -->
    <g>
      <ellipse cx="800" cy="712" rx="212" ry="252" fill="url(#figure)"/>
      <path d="M735 905h130v195H735z" fill="#2A2A2E"/>
      <path d="M250 2000c0-580 250-880 550-880s550 300 550 880z" fill="url(#figure)"/>
      <!-- collar -->
      <path d="M800 1120l-96 78 96 118 96-118z" fill="#141416"/>
      <path d="M800 1120l-96 78 34 42z" fill="#1E1E21"/>
      <path d="M800 1120l96 78-34 42z" fill="#1E1E21"/>
      <!-- rim light -->
      <path d="M250 2000c0-580 250-880 550-880s550 300 550 880z" stroke="url(#rim)" stroke-width="3" fill="none"/>
      <ellipse cx="800" cy="712" rx="212" ry="252" stroke="url(#rim)" stroke-width="3" fill="none"/>
    </g>

    <!-- floor fade so the figure melts into the hero background -->
    <rect x="0" y="1050" width="1600" height="950" fill="url(#fade)"/>

    <!-- inset hairline frame -->
    <rect x="64" y="64" width="1472" height="1872" fill="none" stroke="#B79B6B" stroke-opacity="0.22"/>
    <rect x="80" y="80" width="1440" height="1840" fill="none" stroke="#F5F2EC" stroke-opacity="0.06"/>

    <!-- monogram -->
    <g opacity="0.9">
      <text x="800" y="1560" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="132" fill="#F5F2EC" fill-opacity="0.16" letter-spacing="6">TS</text>
    </g>

    <!-- label -->
    <line x1="640" y1="1660" x2="960" y2="1660" stroke="#B79B6B" stroke-opacity="0.5"/>
    <text x="800" y="1742" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" letter-spacing="11" fill="#B79B6B">PORTRAIT PLACEHOLDER</text>
    <text x="800" y="1806" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="6" fill="#8A8A8F">1600 &#215; 2000 &#183; WEBP</text>
    <text x="800" y="1872" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="4" fill="#6B675F">public/images/tayyab-hero.webp</text>
  </g>
</svg>
